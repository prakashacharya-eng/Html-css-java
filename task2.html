<!DOCTYPE html>
<html lang="en">
<head>
  <title>Three Div Boxes</title>
  <style>
    div {
      border: 2px solid black;
      padding: 20px;
      margin: 30px;
      width: 300px;
      height: 100px;
    }
    .box-two {
      background-color:green;
      color:blue;
      font-size: 18px;
      text-align: center;
    }
    #box-three {
      background-color: black;
      color: yellow;
      font-family: times new roman;
      text-align: right;
    }
  </style>
</head>
<body>
  <div>First div</div>
  <div class="box-two">Second div</div>
  <div id="box-three">Third div</div>
</body>
</html>
